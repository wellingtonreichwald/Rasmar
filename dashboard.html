<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rasmar V1 — Dashboard</title>
<style>
  :root{
    --bg:#f4f2ee; --surface-1:#ece9e2; --surface-2:#ffffff;
    --border:#e0dcd3; --border-strong:#c9c2b3; --border-accent:#cfa863;
    --text-primary:#1e2320; --text-secondary:#5a5951; --text-muted:#8f8b7f;
    --text-success:#0e6b53; --text-danger:#ab2b23; --text-accent:#7a5a2e;
    --fill-primary:#1c2624; --on-primary:#fff;
    --brand:#0f5c4c; --brand-dark:#0b4a3d; --brand-soft:#e6f0ec; --on-brand:#fff;
    --radius:10px; --radius-lg:18px;
    --shadow-sm:0 1px 3px rgba(30,28,20,0.07);
    --shadow-md:0 6px 20px rgba(30,28,20,0.10);
    --shadow-lg:0 12px 32px rgba(30,28,20,0.14);
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(15,92,76,0.05), transparent 45%),
      var(--bg);
    color:var(--text-primary); margin:0; padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.4;
  }
  .wrap{max-width:1160px; margin:0 auto;}
  button, select, input{
    font-family:inherit; cursor:pointer; background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:var(--radius); color:var(--text-primary);
    padding:8px 12px; font-size:13px; font-weight:500;
    transition:filter 0.12s ease, transform 0.08s ease, box-shadow 0.15s ease;
    box-shadow:var(--shadow-sm);
  }
  button:hover{ filter:brightness(0.98); box-shadow:var(--shadow-md); transform:translateY(-1px); }
  button:active{ transform:translateY(0); filter:brightness(0.93); box-shadow:var(--shadow-sm); }
  input[type=text], input[type=password], input[type=date]{ cursor:text; }
  .cabecalho{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:16px 24px; margin:-24px -24px 24px; background:var(--surface-2);
    border-bottom:3px solid var(--brand); box-shadow:var(--shadow-sm);
  }
  h1{font-size:18px; font-weight:700; margin:0;}
  .versao{font-size:11px; background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:var(--on-brand); border-radius:5px; padding:1px 6px; margin-left:6px; font-weight:700;}
  .sub{font-size:11px; color:var(--text-muted); margin:2px 0 0;}
  .cartoes{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .cartao{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow-sm); transition:box-shadow 0.18s ease;}
  .cartao:hover{ box-shadow:var(--shadow-md); }
  .cartao .numero{font-size:26px; font-weight:700; color:var(--brand);}
  .cartao .rotulo{font-size:12px; color:var(--text-secondary); margin-top:4px;}
  .secao{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; margin-bottom:20px; box-shadow:var(--shadow-sm);}
  .secao h2{font-size:15px; margin:0 0 12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{color:var(--text-secondary); font-weight:600; font-size:12px;}
  tbody tr:nth-child(even){background:rgba(15,92,76,0.025);}
  tbody tr:hover{background:var(--brand-soft);}
  .tabela-wrap{overflow-x:auto;}
  #telaBloqueada, #telaLoginDash{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .caixaLogin{background:var(--surface-2); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:32px; max-width:360px; width:100%; text-align:center;}
  .caixaLogin input{width:100%; margin-bottom:8px;}
  a.voltar{color:var(--text-accent); font-size:13px; text-decoration:none;}
  .filtros{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
  .abas{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .abas button{font-weight:500;}
  .abas button.ativa{background:var(--fill-primary); color:var(--on-primary); border-color:var(--fill-primary);}
  .buscaLista{width:100%; margin-bottom:10px;}
  .linhaItem{border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; overflow:hidden;}
  .linhaItem summary{padding:10px 12px; cursor:pointer; font-size:13px; list-style:none;}
  .linhaItem summary::-webkit-details-marker{display:none;}
  .linhaItem summary:before{content:'▸ '; color:var(--text-muted);}
  .linhaItem[open] summary:before{content:'▾ ';}
  .linhaItem .corpo{padding:0 12px 12px;}
  .tagMuted{color:var(--text-muted); font-size:12px;}
  .delta{color:var(--text-accent); font-weight:500;}
  .marcaDash{display:flex; align-items:center; gap:12px;}
  .marcaDash img{border-radius:4px;}
  @media print{
    body{background:#fff; padding:0;}
    .ocultarNaImpressao{display:none !important;}
    .secao, .cartao{box-shadow:none; border:1px solid #ccc;}
    table{font-size:11px;}
  }
</style>
</head>
<body>

<div id="telaBloqueada" style="display:none;">
  <div class="caixaLogin">
    <h1 style="margin-bottom:8px;">Acesso ao Dashboard</h1>
    <p id="mensagemBloqueio" style="font-size:14px; color:var(--text-secondary);"></p>
    <a class="voltar" href="index.html">← voltar pro Rasmar</a>
  </div>
</div>

<div id="telaLoginDash" style="display:none;">
  <div class="caixaLogin">
    <h1 style="margin:0 0 4px;">Rasmar<span class="versao">V1</span></h1>
    <p class="sub" style="margin-bottom:20px;">login para o dashboard</p>
    <input id="loginDashUsuario" type="text" placeholder="usuário" autocomplete="username" />
    <input id="loginDashSenha" type="password" placeholder="senha" autocomplete="current-password" />
    <p id="loginDashErro" style="font-size:13px; color:var(--text-danger); display:none; margin:0 0 8px;"></p>
    <button id="btnLoginDash" style="width:100%; background:var(--brand); color:var(--on-brand); border:none; font-weight:600; padding:10px;">Entrar</button>
    <p style="margin-top:14px;"><a class="voltar" href="index.html">← voltar pro Rasmar</a></p>
  </div>
</div>

<script>
const syncUrl = localStorage.getItem('rasmar_sync_url') || '';
let usuarioLogadoNome = sessionStorage.getItem('rasmar_usuario') || '';
let usuariosCache = [];
let movimentosAtuais = [];
let abaAtiva = 'pecas';

const NOMES_TIPO = {
  bipagem: 'Bipagem',
  envio_individual: 'Envio individual (peça)',
  envio_modulo: 'Envio de módulo',
  defeito_retrabalho: 'Defeito — retrabalho',
  defeito_descarte: 'Defeito — descarte',
  recriacao_peca: 'Peça recriada',
  exclusao_peca: 'Peça excluída',
  exclusao_modulo: 'Módulo excluído',
  conclusao_modulo: 'Módulo concluído',
  conclusao_forcada_modulo: 'Módulo concluído (sem bipar)',
  conclusao_pedido_macro: 'Pedido concluído (em lote)',
  baixa_pedido: 'Baixa do pedido',
  cadastro_manual: 'Cadastro manual',
  importacao_csv: 'Importação de CSV'
};
function nomeTipo(t){ return NOMES_TIPO[t] || t; }

function bloquear(msg){
  document.getElementById('mensagemBloqueio').textContent = msg;
  document.getElementById('telaBloqueada').style.display = 'flex';
}

function buscarNoServidor(params){
  return new Promise((resolve, reject) => {
    const nomeCallback = 'rasmarDashCb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let finalizado = false;
    const limpar = () => { delete window[nomeCallback]; script.remove(); clearTimeout(timeout); };
    const timeout = setTimeout(() => {
      if (finalizado) return; finalizado = true; limpar();
      reject(new Error('tempo esgotado buscando no servidor'));
    }, 20000);
    window[nomeCallback] = (dados) => { if (finalizado) return; finalizado = true; limpar(); resolve(dados); };
    script.onerror = () => { if (finalizado) return; finalizado = true; limpar(); reject(new Error('não consegui buscar no servidor')); };
    const query = new URLSearchParams(Object.assign({ callback: nomeCallback, _: Date.now() }, params)).toString();
    script.src = syncUrl + (syncUrl.includes('?') ? '&' : '?') + query;
    document.body.appendChild(script);
  });
}

function diffLegivel(de, ate){
  if (!de || !ate) return '—';
  const ms = new Date(ate) - new Date(de);
  if (isNaN(ms) || ms < 0) return '—';
  const totalMin = Math.round(ms/60000);
  const dias = Math.floor(totalMin/1440);
  const horas = Math.floor((totalMin%1440)/60);
  const min = totalMin%60;
  let partes = [];
  if (dias) partes.push(dias+'d');
  if (horas) partes.push(horas+'h');
  if (min || partes.length===0) partes.push(min+'min');
  return partes.join(' ');
}

// ---------- visão geral: foco em TEMPO, não em contagem de eventos ----------
// ---------- "pontos" genéricos (tipo de evento, ou bipagem numa etapa
// específica) — usados nos seletores "calcular tempo de / até", pra não
// travar só no CNC→Coladeira→Limpeza fixo. ----------
const ORDEM_ETAPAS_PECA = ['CNC', 'Coladeira', 'Limpeza e Separação', 'Pré Montagem', 'Montagem Final'];

function listarPontos(movimentos){
  const vistos = new Set();
  const pontos = [];
  ORDEM_ETAPAS_PECA.forEach(etapa => {
    if (movimentos.some(m => m.tipo === 'bipagem' && m.detalhe === etapa)){
      const valor = 'bipagem|' + etapa;
      vistos.add(valor);
      pontos.push({ valor, label: 'Bipagem em ' + etapa });
    }
  });
  movimentos.forEach(m => {
    if (m.tipo === 'bipagem') return;
    const valor = m.tipo + '|';
    if (vistos.has(valor)) return;
    vistos.add(valor);
    pontos.push({ valor, label: nomeTipo(m.tipo) });
  });
  return pontos;
}

function popularSelectsDePontos(movimentos){
  const pontos = listarPontos(movimentos);
  const selDe = document.getElementById('pontoDe'), selAte = document.getElementById('pontoAte');
  const valorDeAntes = selDe.value, valorAteAntes = selAte.value;
  const opcoesHtml = pontos.map(p => '<option value="' + p.valor + '">' + p.label + '</option>').join('');
  selDe.innerHTML = opcoesHtml;
  selAte.innerHTML = opcoesHtml;
  const temValor = (sel, v) => Array.from(sel.options).some(o => o.value === v);
  selDe.value = temValor(selDe, valorDeAntes) ? valorDeAntes : (temValor(selDe, 'bipagem|CNC') ? 'bipagem|CNC' : (pontos[0]?.valor || ''));
  selAte.value = temValor(selAte, valorAteAntes) ? valorAteAntes : (temValor(selAte, 'bipagem|Limpeza e Separação') ? 'bipagem|Limpeza e Separação' : (pontos[pontos.length-1]?.valor || ''));
}

function encontrarPonto(eventosOrdenados, pontoValor, apartirIndice){
  const i2 = pontoValor.indexOf('|');
  const tipo = pontoValor.slice(0, i2), detalhe = pontoValor.slice(i2+1);
  for (let i = apartirIndice; i < eventosOrdenados.length; i++){
    const ev = eventosOrdenados[i];
    if (ev.tipo === tipo && (tipo !== 'bipagem' || ev.detalhe === detalhe)) return { ev, indice: i };
  }
  return null;
}

// tempo entre o PRIMEIRO evento que casa com "pontoDeValor" e o primeiro
// evento (depois dele) que casa com "pontoAteValor" — funciona pra qualquer
// combinação escolhida nos seletores, não só as 3 etapas fixas de peça.
function tempoEntrePontos(eventos, pontoDeValor, pontoAteValor){
  const ord = ordenarPorData(eventos);
  const achouDe = encontrarPonto(ord, pontoDeValor, 0);
  if (!achouDe) return { de: null, ate: null, minutos: null };
  const achouAte = encontrarPonto(ord, pontoAteValor, achouDe.indice + 1);
  return { de: achouDe.ev.em, ate: achouAte ? achouAte.ev.em : null, minutos: achouAte ? diffMinutos(achouDe.ev.em, achouAte.ev.em) : null };
}

function calcularEtapasPeca(eventos){
  const etapas = {};
  eventos.forEach(ev => { if (ev.tipo === 'bipagem' && ev.detalhe) etapas[ev.detalhe] = ev.em; });
  return etapas;
}

function diffMinutos(de, ate){
  if (!de || !ate) return null;
  const ms = new Date(ate) - new Date(de);
  if (isNaN(ms) || ms < 0) return null;
  return ms / 60000;
}

function mediaLegivel(valores){
  const validos = valores.filter(v => v !== null && !isNaN(v));
  if (!validos.length) return '—';
  const media = validos.reduce((a,b)=>a+b,0) / validos.length;
  return minutosLegivel(media);
}
function minutosLegivel(totalMinFloat){
  const totalMin = Math.round(totalMinFloat);
  const dias = Math.floor(totalMin/1440), horas = Math.floor((totalMin%1440)/60), min = totalMin%60;
  let partes = [];
  if (dias) partes.push(dias+'d');
  if (horas) partes.push(horas+'h');
  if (min || partes.length===0) partes.push(min+'min');
  return partes.join(' ');
}

// ---------- indicadores (cartões) ----------
function montarCartoes(movimentos){
  const porPeca = agruparPorPeca(movimentos);
  const pontoDe = document.getElementById('pontoDe').value;
  const pontoAte = document.getElementById('pontoAte').value;
  const labelDe = document.getElementById('pontoDe').selectedOptions[0]?.textContent || '';
  const labelAte = document.getElementById('pontoAte').selectedOptions[0]?.textContent || '';

  const temposIntervalo = []; // { pecaCodigo, pecaDescricao, minutos }
  porPeca.forEach(g => {
    const r = tempoEntrePontos(g.eventos, pontoDe, pontoAte);
    if (r.minutos !== null) temposIntervalo.push({ pecaCodigo: g.pecaCodigo, pecaDescricao: g.pecaDescricao, minutos: r.minutos });
  });
  temposIntervalo.sort((a,b) => a.minutos - b.minutos);
  const maisRapida = temposIntervalo[0];
  const maisLenta = temposIntervalo[temposIntervalo.length-1];

  const totalPecas = porPeca.length;
  const totalDescartadas = movimentos.filter(m => m.tipo === 'defeito_descarte').map(m=>m.pecaCodigo);
  const totalRetrabalhos = movimentos.filter(m => m.tipo === 'defeito_retrabalho').map(m=>m.pecaCodigo);
  const taxaDescarte = totalPecas ? (new Set(totalDescartadas).size / totalPecas * 100) : 0;
  const taxaRetrabalho = totalPecas ? (new Set(totalRetrabalhos).size / totalPecas * 100) : 0;

  const modulosUnicos = agruparPorModulo(movimentos).length;
  const projetosUnicos = agruparPorProjeto(movimentos).length;

  const cartoes = [
    { numero: mediaLegivel(temposIntervalo.map(t=>t.minutos)), rotulo: 'tempo médio: ' + labelDe + ' → ' + labelAte, destaque:true },
    { numero: maisLenta ? minutosLegivel(maisLenta.minutos) : '—', rotulo: 'peça mais lenta: ' + (maisLenta ? maisLenta.pecaCodigo : '—'), alerta:true },
    { numero: maisRapida ? minutosLegivel(maisRapida.minutos) : '—', rotulo: 'peça mais rápida: ' + (maisRapida ? maisRapida.pecaCodigo : '—') },
    { numero: taxaDescarte.toFixed(1) + '%', rotulo: 'taxa de descarte por defeito', alerta: taxaDescarte > 0 },
    { numero: taxaRetrabalho.toFixed(1) + '%', rotulo: 'taxa de retrabalho por defeito', alerta: taxaRetrabalho > 0 },
    { numero: totalPecas, rotulo: 'peças com movimento' },
    { numero: modulosUnicos, rotulo: 'módulos com movimento' },
    { numero: projetosUnicos, rotulo: 'pedidos com movimento' }
  ];
  document.getElementById('cartoes').innerHTML = cartoes.map(c =>
    '<div class="cartao"><div class="numero" style="font-size:20px; color:' + (c.alerta ? 'var(--text-danger)' : c.destaque ? 'var(--brand)' : 'var(--text-primary)') + ';">' + c.numero + '</div><div class="rotulo">' + c.rotulo + '</div></div>'
  ).join('');
}

// ---------- linha do tempo completa (detalhe opcional, sob demanda) ----------
function ordenarPorData(eventos){
  return eventos.slice().sort((a,b) => (a.em < b.em ? -1 : a.em > b.em ? 1 : 0));
}

function renderLinhaDoTempo(eventos){
  const ordenados = ordenarPorData(eventos);
  const linhas = ordenados.map((ev, i) => {
    const delta = i === 0 ? '—' : diffLegivel(ordenados[i-1].em, ev.em);
    return '<tr><td>' + ev.em.replace('T',' ') + '</td><td>' + nomeTipo(ev.tipo) + '</td><td>' + (ev.detalhe||'') +
      '</td><td>' + (ev.usuario||'') + '</td><td class="delta">' + (i===0 ? '—' : '+' + delta) + '</td></tr>';
  }).join('');
  return '<table><thead><tr><th>data/hora</th><th>evento</th><th>detalhe</th><th>usuário</th><th>desde o evento anterior</th></tr></thead><tbody>' + linhas + '</tbody></table>';
}

function mostrarLinhaDoTempo(chave){
  const grupo = (ultimosGrupos || []).find(g => g.chave === chave);
  const el = document.getElementById('detalheLinhaDoTempo');
  if (!grupo){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '<h2 style="font-size:14px; margin:0 0 10px;">Linha do tempo completa</h2>' + renderLinhaDoTempo(grupo.eventos);
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ---------- agrupamento por peça / módulo / projeto ----------
function agruparPorPeca(movimentos){
  const grupos = {};
  movimentos.forEach(m => {
    if (!m.pecaCodigo) return;
    if (!grupos[m.pecaCodigo]) grupos[m.pecaCodigo] = { chave: m.pecaCodigo, pecaCodigo: m.pecaCodigo, pecaDescricao:'', moduloId:'', moduloNome:'', clienteCodigo:'', cliente:'', projeto:'', eventos: [] };
    const g = grupos[m.pecaCodigo];
    g.pecaDescricao = g.pecaDescricao || m.pecaDescricao || '';
    g.moduloId = g.moduloId || m.moduloId || '';
    g.moduloNome = g.moduloNome || m.moduloNome || '';
    g.clienteCodigo = g.clienteCodigo || m.clienteCodigo || '';
    g.cliente = g.cliente || m.cliente || '';
    g.projeto = g.projeto || m.projeto || '';
    g.eventos.push(m);
  });
  return Object.values(grupos);
}

function agruparPorModulo(movimentos){
  const grupos = {};
  movimentos.forEach(m => {
    if (!m.moduloId) return;
    const chave = (m.clienteCodigo||'—') + '#' + m.moduloId;
    if (!grupos[chave]) grupos[chave] = { chave, moduloId: m.moduloId, moduloNome:'', clienteCodigo:'', cliente:'', projeto:'', eventos: [], pecasUnicas: new Set() };
    const g = grupos[chave];
    g.moduloNome = g.moduloNome || m.moduloNome || '';
    g.clienteCodigo = g.clienteCodigo || m.clienteCodigo || '';
    g.cliente = g.cliente || m.cliente || '';
    g.projeto = g.projeto || m.projeto || '';
    g.eventos.push(m);
    if (m.pecaCodigo) g.pecasUnicas.add(m.pecaCodigo);
  });
  return Object.values(grupos).map(g => { g.totalPecas = g.pecasUnicas.size; return g; });
}

function agruparPorProjeto(movimentos){
  const grupos = {};
  movimentos.forEach(m => {
    if (!m.clienteCodigo) return;
    if (!grupos[m.clienteCodigo]) grupos[m.clienteCodigo] = { chave: m.clienteCodigo, clienteCodigo: m.clienteCodigo, cliente:'', projeto:'', eventos: [], modulosUnicos: new Set(), pecasUnicas: new Set() };
    const g = grupos[m.clienteCodigo];
    g.cliente = g.cliente || m.cliente || '';
    g.projeto = g.projeto || m.projeto || '';
    g.eventos.push(m);
    if (m.moduloId) g.modulosUnicos.add(m.moduloId);
    if (m.pecaCodigo) g.pecasUnicas.add(m.pecaCodigo);
  });
  return Object.values(grupos).map(g => { g.totalModulos = g.modulosUnicos.size; g.totalPecas = g.pecasUnicas.size; return g; });
}

      '<td><button class="btnVerTudo" data-chave="' + String(g.chave).replace(/"/g,'&quot;') + '" style="font-size:12px; padding:4px 8px;">ver tudo (' + g.eventos.length + ')</button></td>' +

function renderListaDetalhe(){
  const termo = document.getElementById('buscaDetalhe').value.trim().toLowerCase();
  const el = document.getElementById('listaDetalhe');
  document.getElementById('detalheLinhaDoTempo').style.display = 'none';
  let grupos, filtroFn, renderFn;

  if (abaAtiva === 'pecas'){
    grupos = agruparPorPeca(movimentosAtuais);
    filtroFn = g => (g.pecaCodigo+g.pecaDescricao+g.moduloNome+g.cliente+g.projeto).toLowerCase().includes(termo);
    renderFn = renderTabelaPecas;
  } else if (abaAtiva === 'modulos'){
    grupos = agruparPorModulo(movimentosAtuais);
    filtroFn = g => (g.moduloId+g.moduloNome+g.cliente+g.projeto).toLowerCase().includes(termo);
    renderFn = renderTabelaModulos;
  } else {
    grupos = agruparPorProjeto(movimentosAtuais);
    filtroFn = g => (g.clienteCodigo+g.cliente+g.projeto).toLowerCase().includes(termo);
    renderFn = renderTabelaProjetos;
  }
  if (termo) grupos = grupos.filter(filtroFn);
  grupos = grupos.sort((a,b) => b.eventos.length - a.eventos.length);
  ultimosGrupos = grupos;

  if (!grupos.length){ el.innerHTML = '<p class="tagMuted">nada encontrado</p>'; return; }
  el.innerHTML = '<div class="tabela-wrap">' + renderFn(grupos) + '</div>';
}

}
document.getElementById('loginDashSenha').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnLoginDash').click(); });

function mostrarConteudo(u){
  document.getElementById('usuarioTexto').textContent = u.usuario + (u.admin ? ' · admin' : '');
  document.getElementById('conteudo').style.display = 'block';
  carregar();
}

async function iniciar(){
  if (!syncUrl){
    bloquear('A sincronização ainda não foi configurada. Volte pro Rasmar principal, faça login como admin e configure a sincronização primeiro.');
    return;
  }
  try {
    const dados = await buscarNoServidor({});
    usuariosCache = Array.isArray(dados.usuarios) ? dados.usuarios : [];
  } catch (err) {
    bloquear('Não consegui conectar com a planilha: ' + err.message);
    return;
  }
  if (usuariosCache.length === 0){
    bloquear('Ainda não existe nenhum usuário criado. Volte pro Rasmar principal e crie o primeiro administrador.');
    return;
  }
  const jaLogado = usuariosCache.find(u => u.usuario === usuarioLogadoNome);
  if (jaLogado){
    mostrarConteudo(jaLogado);
  } else {
    mostrarLoginDash();
  }
}
iniciar();
</script>
</body>
</html>
